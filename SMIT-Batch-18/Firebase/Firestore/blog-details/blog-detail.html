<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Detail</title>
    <link rel="stylesheet" href="blog-detail.css">
</head>

<body>
    <div class="detail_page">

        <div class="blog_detail">

            <h1>My Blogs</h1>

            <nav>
                <a href="/index.html"><- Back to Home</a>
            </nav>

            <h5 id="category"></h5>
            <h1 id="title"></h1>
            <p id="authorId"></p>
            <p id="published"></p>

            <img src="/user-pic.webp" alt="">

            <p id="content"></p>
        </div>

        <div class="comments">

            <!-- Comments -->
            <h1>Comments</h1>
            <textarea name="" id="" placeholder="Write your comment here"></textarea>
            <button>Post Comment</button>

            <!-- Show User Comments -->
            <div class="user_comments">
                <div class="comment_1">
                    <h1>Ali</h1>
                    <p>Great Blog</p>
                    <p>23 August 2026</p>
                </div>
            </div>

        </div>

    </div>
    <script type="module" src="blog-detail.js"></script>
</body>

</html>
